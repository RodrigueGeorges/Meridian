# fly.toml — app de production meridian-2ejyig, région principale Paris, données dans l'UE.
# Alignée sur infra/fly/api.prod.toml (source de vérité : les commentaires et le détail y sont).
# fly deploy                     (utilise ce fichier)
# fly deploy --config infra/fly/api.prod.toml   (identique)

app = 'meridian-2ejyig'
primary_region = 'cdg'

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRUST_PROXY = "true"
  SCAN_MS = "3000"
  JOURNAL_KEY_ID = "1"
  MASTER_KEY_VERSION = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  kill_timeout = "30s" # drain de l'arrêt : le moteur termine les paiements en cours
  processes = ['app']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
