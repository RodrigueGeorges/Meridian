name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meridian" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgres://meridian:meridian@localhost:5432/meridian
      PROP_RUNS: "200"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Vulnérabilités connues des dépendances de production (PCI DSS 6.3.3)
        run: pnpm audit --prod --audit-level high
      - name: Tests unitaires, conformité (8 scénarios), propriétés, E2E mémoire + PostgreSQL
        run: pnpm test
      - name: Conformité explicite (200 séquences de pannes aléatoires)
        run: pnpm conformance
      - name: Recherche de secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
