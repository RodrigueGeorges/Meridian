name: sandbox-stripe
# Conformité contre la sandbox Stripe réelle, dans chacun des 6 pays de lancement.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

jobs:
  sandbox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        country: [FR, BE, NL, DE, ES, IT]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - name: Scénarios réels (clé de test uniquement)
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_TEST_KEY }}
          COUNTRY: ${{ matrix.country }}
        run: node tools/sandbox-check/meridian-sandbox-test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rapport-sandbox-${{ matrix.country }}
          path: rapport-sandbox-*.md
